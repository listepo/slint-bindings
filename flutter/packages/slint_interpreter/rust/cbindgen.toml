language = "C"
# Written into the header by cbindgen itself, so a regenerated header always
# carries it.
autogen_warning = "/* GENERATED by cbindgen from src/lib.rs, do not edit. Regenerate: cd packages/slint_interpreter/rust && cbindgen --output include/slint_interpreter_ffi.h */"
include_guard = "SLINT_INTERPRETER_FFI_H"
cpp_compat = true

[export]
exclude = ["NativePlatform", "InstanceHandle"]

name: slint_interpreter
description: "Slint runtime for Flutter over Rust FFI: compiles .slint UIs at runtime with slint-interpreter and draws them with the software renderer in a SlintView."
version: 0.0.1
license: Apache-2.0
homepage: https://github.com/listepo/slint_dart
repository: https://github.com/listepo/slint_dart/tree/main/packages/slint_interpreter
issue_tracker: https://github.com/listepo/slint_dart/issues
topics:
  - slint
  - ui
  - gui
  - ffi
  - rust
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  slint: ^0.0.1
  ffi: ^2.1.0
  hooks: ^2.0.0
  slint_build: ^0.0.1
  slint_generator: ^0.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^22.0.0

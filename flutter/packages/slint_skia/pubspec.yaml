name: slint_skia
description: "Experimental GPU backend for Slint on Flutter over Rust FFI: slint-interpreter plus the Skia renderer, aimed at a Flutter external texture."
version: 0.0.1
license: Apache-2.0
homepage: https://github.com/listepo/slint_dart
repository: https://github.com/listepo/slint_dart/tree/main/packages/slint_skia
issue_tracker: https://github.com/listepo/slint_dart/issues
topics:
  - slint
  - skia
  - gpu
  - ffi
  - rust
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  slint: ^0.0.1
  ffi: ^2.1.0
  hooks: ^2.0.0
  slint_build: ^0.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^22.0.0

# The platform half of the GPU path: each plugin registers the Flutter
# texture slint-skia-ffi renders into (see lib/src/skia_engine.dart).
flutter:
  plugin:
    platforms:
      android:
        package: dev.slint.slint_skia
        pluginClass: SlintSkiaPlugin
      ios:
        pluginClass: SlintSkiaPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SlintSkiaPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: SlintSkiaPlugin
      windows:
        pluginClass: SlintSkiaPluginCApi


language = "C"
# Written into the header by cbindgen itself, so a regenerated header always
# carries it.
autogen_warning = "/* GENERATED by cbindgen from src/lib.rs, do not edit. Regenerate: cd packages/slint_skia/rust && cbindgen --output include/slint_skia_ffi.h */"
includes = []
include_guard = "SLINT_SKIA_FFI_H"
cpp_compat = true

# System functions the platform modules import (`extern "C" { ... }`), not
# part of this crate's ABI.
[export]
exclude = [
  "ANativeWindow_fromSurface",
  "ANativeWindow_release",
  "dlopen",
  "dlsym",
  "objc_autoreleasePoolPush",
  "objc_autoreleasePoolPop",
]

# The attach entry points exist on one platform each; the header guards them
# the same way. `__linux__` is also defined on Android, where the Linux-only
# entry points are absent: the Dart side never calls them there.
[defines]
"target_vendor = apple" = "__APPLE__"
"target_os = android" = "__ANDROID__"
"target_os = linux" = "__linux__"
"target_os = windows" = "_WIN32"

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # ffigen output nothing imports; generated over system headers it carries
    # ~80 unused-field warnings. Also kept out of the published archive (.pubignore).
    - lib/src/bindings.g.dart
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

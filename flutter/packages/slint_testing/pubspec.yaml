name: slint_testing
description: "Headless tests for Slint UIs under plain dart test: query the accessibility tree by label, id or type, click, and assert on properties and callbacks."
version: 0.0.1
license: Apache-2.0
homepage: https://github.com/listepo/slint_dart
repository: https://github.com/listepo/slint_dart/tree/main/packages/slint_testing
issue_tracker: https://github.com/listepo/slint_dart/issues
topics:
  - slint
  - testing
  - accessibility
  - ffi
  - rust
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  hooks: ^2.0.0
  slint: ^0.0.1
  slint_build: ^0.0.1
dev_dependencies:
  ffigen: ^22.0.0
  lints: ^6.0.0
  test: ^1.25.0

language = "C"
# Written into the header by cbindgen itself, so a regenerated header always
# carries it.
autogen_warning = "/* GENERATED by cbindgen from src/lib.rs, do not edit. Regenerate: cd packages/slint_testing/rust && cbindgen --output include/slint_testing_ffi.h */"
include_guard = "SLINT_TESTING_FFI_H"
cpp_compat = true

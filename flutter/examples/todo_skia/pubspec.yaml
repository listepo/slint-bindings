name: todo_skia_example
description: Todo demo on the slint_skia backend — the same ui/todo.slint as examples/todo, compiled by the Skia engine at runtime and meant for a Flutter external texture.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  slint: ^0.0.1
  # Only for its build_runner builder: lib/todo.g.dart embeds ui/todo.slint
  # (slintSource, componentName, TodoItem). The typed TodoApp needs a
  # software-rendering factory, which the Skia backend does not provide yet.
  slint_generator: ^0.0.1
  slint_skia: ^0.0.1
  todo_shared: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
  # ui/todo.slint is deliberately not an asset: the builder embeds its source
  # in todo.g.dart, so bundling the file too would ship the UI source twice.

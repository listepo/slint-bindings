# Generates the one C header both hosts consume: `just header`.
language = "C"
include_guard = "SLINT_BINDINGS_H"
autogen_warning = "/* Generated by cbindgen from crates/slint-bindings-ffi. Do not edit; run `just header`. */"
usize_is_size_t = true
cpp_compat = true

[export]
prefix = ""
include = ["SbFrame", "SbPointerButton"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

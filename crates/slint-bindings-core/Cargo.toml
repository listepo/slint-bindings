[package]
name = "slint-bindings-core"
description = "Host-driven Slint embedding: a custom platform that renders into a caller-owned pixel buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
slint = { workspace = true }
slint-embed = { workspace = true }
i-slint-core = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Feature-unification dependency for image and SVG decoding (see the workspace
# manifest). The host also calls into it for composition and the focus chain;
# the ignore stays so dropping those calls does not look like an unused crate.
ignored = ["i-slint-core"]
